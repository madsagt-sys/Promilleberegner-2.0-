<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142536"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Promille"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Promilleberegner</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#182637;background:#eef2f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:auto;padding:18px 16px 40px}.head{background:#142536;color:white;border-radius:20px;padding:23px 19px;margin-bottom:18px}.head h1{margin:0;font-size:26px}.head p{color:#b9cad9;font-size:12px;letter-spacing:1.2px;margin:8px 0 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}.tabs button{border:0;border-radius:12px;padding:14px 3px;font-weight:700;background:white;color:#30435a;font-size:15px}.tabs button.active{background:#f39122;color:#111}.card{background:white;border-radius:20px;padding:20px;box-shadow:0 4px 18px #1a304015}.card h2{margin:0 0 7px;font-size:21px}.formula{font-size:13px;color:#64748b;margin-bottom:22px}.field{margin:17px 0}label{display:block;font-size:14px;font-weight:650;margin-bottom:7px}input,select{font:inherit;font-size:21px;border:1.5px solid #cad4e0;border-radius:12px;padding:13px 12px;background:#fff;color:#182637;width:100%;min-width:0}input:focus,select:focus{outline:2px solid #f39122;border-color:#f39122}.duo{display:grid;grid-template-columns:1fr 110px;gap:8px}.result{background:#eaf5ee;border-radius:15px;text-align:center;padding:23px 12px;margin-top:24px}.result small{display:block;color:#466454;font-weight:600}.result strong{display:block;color:#087138;font-size:38px;margin:9px 0;overflow-wrap:anywhere}.result span{font-size:15px;color:#2d5d44}.reset{width:100%;margin-top:16px;background:#edf1f6;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:600}.quick{margin-top:20px}.quick h3{font-size:15px}.quickgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.quickgrid div{background:white;border-radius:9px;padding:12px 2px;text-align:center;font-size:12px}.quickgrid b{display:block;font-size:15px;margin-bottom:5px}.note{color:#6b7786;font-size:12px;margin-top:19px;line-height:1.5}</style></head><body><main class="wrap"><header class="head"><h1>📐 Promilleberegner</h1><p>KLOAK · ANLÆG · AFSÆTNING</p></header><nav class="tabs"><button class="active" data-mode="fald">Fald</button><button data-mode="laengde">Længde</button><button data-mode="promille">Promille</button></nav><section class="card"><h2 id="heading">Beregn fald</h2><div class="formula" id="formula"></div><div id="fields"></div><div class="result" aria-live="polite"><small id="resultlabel"></small><strong id="result"></strong><span id="secondary"></span></div><button class="reset" id="reset">↺ Nulstil værdier</button></section><section class="quick"><h3>Hurtig omregning</h3><div class="quickgrid"><div><b>5 ‰</b>5 mm/m</div><div><b>10 ‰</b>10 mm/m</div><div><b>15 ‰</b>15 mm/m</div><div><b>20 ‰</b>20 mm/m</div><div><b>25 ‰</b>25 mm/m</div></div></section><p class="note">Alle højdeforskelle regnes om til meter før beregning. Resultaterne er vejledende; kontrollér altid afsætning og projektkrav.</p></main><script>const state={mode:'fald',length:'13',fall:'20',permille:'15',unit:'cm'};const $=id=>document.getElementById(id);const num=x=>Number(String(x).replace(',','.'));const fmt=(x,n=2)=>Number.isFinite(x)?x.toLocaleString('da-DK',{maximumFractionDigits:n}):'—';const input=(key,label)=>`<div class="field"><label for="${key}">${label}</label><input id="${key}" inputmode="decimal" type="text" value="${state[key]}"></div>`;const fallField=()=>`<div class="field"><label for="fall">Fald (højdeforskel)</label><div class="duo"><input id="fall" inputmode="decimal" type="text" value="${state.fall}"><select id="unit"><option value="mm" ${state.unit==='mm'?'selected':''}>mm</option><option value="cm" ${state.unit==='cm'?'selected':''}>cm</option><option value="m" ${state.unit==='m'?'selected':''}>meter</option></select></div></div>`;function render(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));const m=state.mode; $('heading').textContent=m==='fald'?'Beregn fald (højdeforskel)':m==='laengde'?'Beregn længde':'Beregn promille';$('formula').textContent=m==='fald'?'Fald = promille × længde / 1000':m==='laengde'?'Længde = fald × 1000 / promille':'Promille = fald × 1000 / længde';$('fields').innerHTML=m==='fald'?input('permille','Promille (‰)')+input('length','Længde (meter)'):m==='laengde'?fallField()+input('permille','Promille (‰)'):fallField()+input('length','Længde (meter)');$('fields').querySelectorAll('input,select').forEach(el=>el.addEventListener('input',e=>{state[e.target.id]=e.target.value;calc()}));calc()}function calc(){const l=num(state.length),p=num(state.permille),f=num(state.fall),fm=f*({mm:.001,cm:.01,m:1}[state.unit]);const m=state.mode;const valid=m==='fald'?l>0&&p>=0:m==='laengde'?p>0&&fm>=0:l>0&&fm>=0;const r=m==='fald'?p*l/1000:m==='laengde'?fm*1000/p:fm*1000/l;$('resultlabel').textContent=m==='fald'?'Beregnet fald':m==='laengde'?'Beregnet længde':'Beregnet promille';$('result').textContent=valid?fmt(r)+(m==='promille'?' ‰':' m'):'—';$('secondary').textContent=!valid?'Indtast gyldige værdier':m==='fald'?`${fmt(r*100)} cm = ${fmt(r*1000)} mm`:m==='laengde'?`${fmt(r*100)} cm i længden`:`${fmt(r,1)} ‰ (afrundet)`}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.mode;render()}));$('reset').addEventListener('click',()=>{Object.assign(state,{length:'13',fall:'20',permille:'15',unit:'cm'});render()});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
